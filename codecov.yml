codecov:
  require_ci_to_pass: yes
  notify:
    # 現状は unit ジョブの 1 レポートのみ。Docker/Podman ランタイムジョブ追加時（T20）に増やすこと
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        # カバレッジは参考指標（docs/testing/strategy.md 第6節: 目標値として掲げない）
        target: auto
        informational: true
      unit:
        flags:
          - unit
        target: auto
        informational: true
      runtime:
        flags:
          - runtime
        target: auto
        informational: true
    patch:
      default:
        # project ステータスと同様に参考指標（docs/testing/strategy.md 第6節）
        target: auto
        informational: true

flag_management:
  default_rules:
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
