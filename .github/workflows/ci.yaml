name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Run unit tests
      run: go test -v -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /scripts)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        files: coverage.out
        flags: unit
        fail_ci_if_error: false

  runtime-test-containerd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Build cderun binary
      run: go build -o cderun main.go
    - name: Install containerd
      run: |
        VERSION=2.2.3
        TARBALL="containerd-${VERSION}-linux-amd64.tar.gz"
        URL="https://github.com/containerd/containerd/releases/download/v${VERSION}/${TARBALL}"
        wget -q "$URL"
        wget -q "${URL}.sha256sum"
        sha256sum -c "${TARBALL}.sha256sum"
        sudo tar Cxzvf /usr/local "$TARBALL"
        sudo cp testdata/containerd.service /etc/systemd/system/containerd.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now containerd
    - name: Install CNI plugins
      run: |
        VERSION=1.6.2
        TARBALL="cni-plugins-linux-amd64-v${VERSION}.tgz"
        URL="https://github.com/containernetworking/plugins/releases/download/v${VERSION}/${TARBALL}"
        wget -q "$URL"
        wget -q "${URL}.sha256"
        echo "$(awk '{print $1}' ${TARBALL}.sha256)  ${TARBALL}" | sha256sum -c -
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin "$TARBALL"
    - name: Set containerd socket ACLs
      run: |
        sudo apt-get install -y acl
        sudo setfacl -m u:${USER}:rw /run/containerd/containerd.sock
    - name: Run containerd integration tests
      run: |
        export CDERUN_RUNTIME=containerd
        export CDERUN_SOCKET_PATH=/run/containerd/containerd.sock
        go test -v -tags=runtime ./...

  runtime-test-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Build cderun binary
      run: go build -o cderun main.go
    - name: Run Docker integration tests
      run: |
        export CDERUN_RUNTIME=docker
        export CDERUN_SOCKET_PATH=/var/run/docker.sock
        go test -v -tags=runtime ./...

  runtime-test-podman:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Build cderun binary
      run: go build -o cderun main.go
    - name: Install and start Podman service
      run: |
        sudo apt-get update
        sudo apt-get install -y podman
        podman system service --time=0 unix:///tmp/podman.sock > /tmp/podman.log 2>&1 &
        PODMAN_PID=$!
        READY=0
        for i in $(seq 1 30); do
          if ! kill -0 $PODMAN_PID 2>/dev/null; then
            echo "Podman service process exited unexpectedly"
            cat /tmp/podman.log
            exit 1
          fi
          if curl -s --unix-socket /tmp/podman.sock http://d/_ping >/dev/null 2>&1 || curl -s --unix-socket /tmp/podman.sock http://d/libpod/_ping >/dev/null 2>&1; then
            READY=1
            break
          fi
          sleep 0.5
        done
        if [ $READY -ne 1 ]; then
          echo "Podman service failed to become ready in time"
          cat /tmp/podman.log
          exit 1
        fi
    - name: Run Podman integration tests
      run: |
        export CDERUN_RUNTIME=podman
        export CDERUN_SOCKET_PATH=/tmp/podman.sock
        go test -v -tags=runtime ./...
