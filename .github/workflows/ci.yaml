name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ouchi-kubernetes
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Verify test file names
      env:
        TARGET_BRANCH: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
      run: ./scripts/check-test-names.sh
    - name: Run unit tests
      run: go test -v -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /scripts)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        files: coverage.out
        flags: unit
        fail_ci_if_error: false

  runtime-test-containerd:
    runs-on: ubuntu-24.04
    env:
      CDERUN_SOCKET_PATH: /run/cderun-containerd/containerd.sock
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Install containerd
      run: |
        VERSION=2.2.3
        TARBALL="containerd-${VERSION}-linux-amd64.tar.gz"
        URL="https://github.com/containerd/containerd/releases/download/v${VERSION}/${TARBALL}"
        curl -fsSL "$URL" -o "$TARBALL"
        curl -fsSL "${URL}.sha256sum" -o "${TARBALL}.sha256sum"
        sha256sum -c "${TARBALL}.sha256sum"
        sudo tar Cxzvf /usr/local "$TARBALL"
        sudo /usr/local/bin/containerd config default > "$RUNNER_TEMP/containerd.toml"
        sudo systemd-run --unit=cderun-containerd /usr/local/bin/containerd \
          --config "$RUNNER_TEMP/containerd.toml" --address "$CDERUN_SOCKET_PATH" \
          --state /run/cderun-containerd --root /var/lib/cderun-containerd
        for i in {1..30}; do
          if [ -S "$CDERUN_SOCKET_PATH" ]; then
            echo "containerd socket ready"
            break
          fi
          echo "Waiting for containerd socket..."
          sleep 1
        done
        if [ ! -S "$CDERUN_SOCKET_PATH" ]; then
          echo "containerd failed to start. Logs:"
          sudo journalctl -u cderun-containerd --no-pager
          exit 1
        fi
    - name: Install CNI plugins
      run: |
        VERSION=1.6.2
        TARBALL="cni-plugins-linux-amd64-v${VERSION}.tgz"
        URL="https://github.com/containernetworking/plugins/releases/download/v${VERSION}/${TARBALL}"
        curl -fsSL "$URL" -o "$TARBALL"
        curl -fsSL "${URL}.sha256" -o "${TARBALL}.sha256"
        echo "$(awk '{print $1}' ${TARBALL}.sha256)  ${TARBALL}" | sha256sum -c -
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin "$TARBALL"
    - name: Set containerd socket ACLs
      run: |
        sudo apt-get update || (sleep 2 && sudo apt-get update)
        sudo apt-get install -y acl
        RUNNER_UID="$(id -u)"
        SOCKET_PATH="$CDERUN_SOCKET_PATH"
        SOCKET_DIR="${SOCKET_PATH%/*}"
        if [ ! -x "$SOCKET_DIR" ]; then
          sudo setfacl -m "u:$RUNNER_UID:--x" "$SOCKET_DIR"
        fi
        sudo setfacl -m "u:$RUNNER_UID:rw" "$SOCKET_PATH"
        if ! timeout 10s /usr/local/bin/ctr --address "$SOCKET_PATH" version; then
          id
          sudo getfacl -p "$SOCKET_DIR" "$SOCKET_PATH"
          exit 1
        fi
    - name: Build cderun binary
      run: CGO_ENABLED=0 go build -o cderun main.go
    - name: Run containerd integration tests
      run: |
        export CDERUN_ENGINE=containerd
        export CDERUN_NETWORK=host
        # The containerd client mounts snapshots locally to resolve image users.
        go test -count=1 -tags=runtime -v \
          -exec 'sudo --preserve-env=CI,CDERUN_ENGINE,CDERUN_NETWORK,CDERUN_SOCKET_PATH' \
          ./internal/runtime/... ./internal/command/...

  runtime-test-docker:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Build cderun binary
      run: CGO_ENABLED=0 go build -o cderun main.go
    - name: Wait for Docker daemon
      run: |
        for i in {1..30}; do
          if [ -S /var/run/docker.sock ] && timeout 10s docker -H unix:///var/run/docker.sock info > /dev/null 2>&1; then
            echo "Docker daemon ready"
            break
          fi
          echo "Waiting for Docker daemon..."
          sleep 1
        done
        timeout 10s docker -H unix:///var/run/docker.sock info
    - name: Run Docker integration tests
      run: |
        export CDERUN_ENGINE=docker
        export CDERUN_SOCKET_PATH=/var/run/docker.sock
        runtime_tmp_dir="$(mktemp -d /tmp/cde.XXXXXX)"
        export TEST_HOST_TMP_DIR="$runtime_tmp_dir"
        trap 'rm -rf -- "$runtime_tmp_dir"' EXIT
        touch "$runtime_tmp_dir/bind-probe"
        if ! docker -H "unix://$CDERUN_SOCKET_PATH" run --rm \
          --mount "type=bind,source=$runtime_tmp_dir,target=/probe,readonly" \
          public.ecr.aws/docker/library/alpine:latest test -f /probe/bind-probe; then
          echo "Docker runtime tests require a temporary directory shared with the daemon at $runtime_tmp_dir"
          exit 1
        fi
        go test -count=1 -tags=runtime -v ./internal/runtime/... ./internal/command/...

  runtime-test-podman:
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Install Podman
      run: |
        sudo apt-get update || (sleep 2 && sudo apt-get update)
        sudo apt-get install -y podman
    - name: Build cderun binary
      run: CGO_ENABLED=0 go build -o cderun main.go
    - name: Run Podman integration tests
      run: |
        export CDERUN_ENGINE=podman
        export CDERUN_SOCKET_PATH="$RUNNER_TEMP/podman.sock"
        PODMAN_LOG="$RUNNER_TEMP/podman-service.log"
        podman system service --time=0 "unix://$CDERUN_SOCKET_PATH" > "$PODMAN_LOG" 2>&1 &
        PODMAN_PID=$!
        trap 'kill "$PODMAN_PID" 2>/dev/null || true' EXIT
        for i in {1..30}; do
          if [ -S "$CDERUN_SOCKET_PATH" ] && timeout 3s podman --remote --url "unix://$CDERUN_SOCKET_PATH" info > /dev/null 2>&1; then
            go test -count=1 -tags=runtime -v ./internal/runtime/... ./internal/command/...
            exit $?
          fi
          if ! kill -0 "$PODMAN_PID" 2>/dev/null; then
            break
          fi
          sleep 1
        done
        echo "Podman API did not become ready at $CDERUN_SOCKET_PATH"
        cat "$PODMAN_LOG"
        exit 1
