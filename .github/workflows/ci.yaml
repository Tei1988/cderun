name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.go-version'
              - 'Makefile'
              - '.github/workflows/*.{yml,yaml}'
            docs:
              - '**/*.md'
              - 'scripts/check-links.sh'

  verify-pinning:
    name: Verify Action Pinning
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Verify Pinning (Makefile)
        run: make lint-actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-go:
    name: Lint Go
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.3

  lint-md:
    name: Lint Markdown
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: make lint-md
      - name: Check Markdown links
        run: make link-check

  build:
    name: Build Binary
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build cderun
        env:
          CGO_ENABLED: 0
        run: go build -v -o cderun main.go
      - name: Upload Binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cderun-binary
          path: cderun
          retention-days: 1

  unit-test:
    name: Unit Tests
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Run Coverage
        run: make coverage
      - name: Verify Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 86.5" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below threshold 86.5%"
            false
          fi
      - name: Upload Coverage Report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unit
          fail_ci_if_error: true

  runtime-test:
    name: Runtime Tests (Docker ${{ matrix.docker-version }})
    needs: [filter, build]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker-version: ["20.10", "25.0", "29.0"]

    services:
      docker:
        image: docker:${{ matrix.docker-version }}-dind
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -v /home/runner/work:/home/runner/work -v /tmp:/tmp
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cderun-binary

      - name: Make binary executable
        run: chmod +x cderun

      - name: Runtime Tests
        env:
          DOCKER_HOST: tcp://localhost:2375
          TEST_HOST_TMP_DIR: ${{ github.workspace }}/tmp-runtime
          CDERUN_HANG_TIMEOUT: 10s
        run: |
          mkdir -p $TEST_HOST_TMP_DIR
          docker version
          go test -v -tags=runtime -timeout 15m -run "^TestScenario_|^TestRuntime_" -coverprofile=coverage-runtime.out ./internal/command/...

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-runtime.out
          flags: runtime
          env_vars: DOCKER_VERSION
          fail_ci_if_error: true
        env:
          DOCKER_VERSION: ${{ matrix.docker-version }}

  runtime-test-podman:
    name: Runtime Tests (Podman v5.8.1)
    needs: [filter, build]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable:v5.8.1
      options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cderun-binary

      - name: Make binary executable
        run: chmod +x cderun

      - name: Start Podman Service
        run: |
          mkdir -p /run/podman
          podman --log-level=debug system service --time=0 unix:///run/podman/podman.sock > /tmp/podman.log 2>&1 &
          timeout 30s sh -c 'while ! podman --url unix:///run/podman/podman.sock system info >/dev/null 2>&1; do sleep 1; done'
          chmod 666 /run/podman/podman.sock

      - name: Runtime Tests
        env:
          CDERUN_RUNTIME: podman
          CDERUN_SOCKET_PATH: /run/podman/podman.sock
          TEST_HOST_TMP_DIR: /tmp/runtime-podman
          CDERUN_HANG_TIMEOUT: 10s
        run: |
          mkdir -p $TEST_HOST_TMP_DIR
          CONTAINER_HOST=unix:///run/podman/podman.sock podman version
          DOCKER_HOST=unix:///run/podman/podman.sock go test -v -tags=runtime -timeout 15m -run "^TestScenario_|^TestRuntime_" -coverprofile=coverage-podman.out ./internal/command/...

      - name: Diagnostic on Failure
        if: failure()
        run: |
          echo "--- Podman Service Log ---"
          cat /tmp/podman.log || true
          echo "--- Podman Info ---"
          CONTAINER_HOST=unix:///run/podman/podman.sock podman system info || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-podman.out
          flags: podman
          fail_ci_if_error: true

  runtime-test-containerd:
    name: Runtime Tests (containerd v2.2.2)
    needs: [filter, build]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Download Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cderun-binary

      - name: Make binary executable
        run: chmod +x cderun

      - name: Setup containerd
        run: |
          # Install containerd v2.2.2
          wget -q https://github.com/containerd/containerd/releases/download/v2.2.2/containerd-2.2.2-linux-amd64.tar.gz
          echo "2c08c99cbde73b3388c6d5da68e0bcaebc70c9174f2b14d785695e4401b3ede0  containerd-2.2.2-linux-amd64.tar.gz" | sha256sum -c -
          sudo tar Cxzvf /usr/local containerd-2.2.2-linux-amd64.tar.gz
          # Ubuntu systemd unit might point to /usr/bin/containerd
          if [ -f /usr/bin/containerd ]; then
            sudo cp /usr/local/bin/containerd /usr/bin/containerd
          fi
          sudo systemctl restart containerd

          # Install CNI plugins
          wget -q https://github.com/containernetworking/plugins/releases/download/v1.6.2/cni-plugins-linux-amd64-v1.6.2.tgz
          echo "b8e811578fb66023f90d2e238d80cec3bdfca4b44049af74c374d4fae0f9c090  cni-plugins-linux-amd64-v1.6.2.tgz" | sha256sum -c -
          sudo mkdir -p /opt/cni/bin
          sudo tar Cxzvf /opt/cni/bin cni-plugins-linux-amd64-v1.6.2.tgz
      - name: Check containerd
        run: |
          # Grant access to the runner user using ACLs (least privilege)
          sudo apt-get update && sudo apt-get install -y acl
          sudo setfacl -m u:${USER}:rw /run/containerd/containerd.sock

          # Wait for containerd to be ready
          timeout 30s sh -c 'while ! ctr --address /run/containerd/containerd.sock version >/dev/null 2>&1; do sleep 1; done'

          # Verify version (Server version)
          if ! sudo ctr version | sed -n '/Server:/,/UUID:/p' | grep -q "2.2.2"; then
            echo "Error: containerd version 2.2.2 is required"
            exit 1
          fi

      - name: Runtime Tests
        env:
          CDERUN_RUNTIME: containerd
          CDERUN_SOCKET_PATH: /run/containerd/containerd.sock
          TEST_HOST_TMP_DIR: ${{ github.workspace }}/tmp-runtime-containerd
          CDERUN_HANG_TIMEOUT: 10s
        run: |
          mkdir -p $TEST_HOST_TMP_DIR
          # Note: containerd runs with a wider scope (./internal/...) to include its unit tests
          # in internal/runtime, but still uses the runtime tag for E2E scenarios.
          go test -v -tags=runtime -timeout 15m -coverprofile=coverage-containerd.out ./internal/...
      - name: Diagnostic on Failure
        if: failure()
        env:
          CDERUN_RUNTIME: containerd
          CDERUN_SOCKET_PATH: /run/containerd/containerd.sock
        run: |
          echo "--- Containerd Info ---"
          ./cderun --diagnosis || true
          echo "--- Socket Check ---"
          ls -la /run/containerd/ || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-containerd.out
          flags: containerd
          fail_ci_if_error: true
