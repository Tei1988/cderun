name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Run unit tests
      run: go test -v ./...

  runtime-test-containerd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
    - name: Install containerd
      run: |
        VERSION=2.2.2
        wget https://github.com/containerd/containerd/releases/download/v${VERSION}/containerd-${VERSION}-linux-amd64.tar.gz
        sudo tar Cxzvf /usr/local containerd-${VERSION}-linux-amd64.tar.gz
        sudo wget https://raw.githubusercontent.com/containerd/containerd/main/containerd.service -O /etc/systemd/system/containerd.service
        sudo systemctl daemon-reload
        sudo systemctl enable --now containerd
    - name: Install CNI plugins
      run: |
        VERSION=1.6.2
        wget https://github.com/containernetworking/plugins/releases/download/v${VERSION}/cni-plugins-linux-amd64-v${VERSION}.tgz
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin cni-plugins-linux-amd64-v${VERSION}.tgz
    - name: Set containerd socket ACLs
      run: |
        sudo apt-get install -y acl
        sudo setfacl -m u:${USER}:rw /run/containerd/containerd.sock
    - name: Run containerd integration tests
      run: |
        export CDERUN_RUNTIME=containerd
        export CDERUN_SOCKET=/run/containerd/containerd.sock
        go test -v ./internal/runtime/...
