name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.go-version'
              - 'Makefile'
              - '.github/workflows/*.yml'
            docs:
              - '**/*.md'
              - 'scripts/check-links.sh'

  lint-go:
    name: Lint Go
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.9.0

  lint-md:
    name: Lint Markdown
    needs: filter
    if: needs.filter.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: make lint-md
      - name: Check Markdown links
        run: make link-check

  build:
    name: Build Binary
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Build cderun
        env:
          CGO_ENABLED: 0
        run: go build -v -o cderun main.go
      - name: Upload Binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cderun-binary
          path: cderun
          retention-days: 1

  unit-test:
    name: Unit Tests
    needs: filter
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: true
      - name: Run Coverage
        run: make coverage
      - name: Verify Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "${COVERAGE} < 86.5" | bc -l)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below threshold 86.5%"
            false
          fi
      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unit
          fail_ci_if_error: true

  verify-images:
    name: Verify Registry Images
    needs: filter
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check ECR Public Image Manifests
        run: |
          for version in "20.10" "24.0" "27.0"; do
            tag="${version}-dind"
            url="https://public.ecr.aws/v2/docker/library/docker/manifests/${tag}"
            echo "Verifying image: public.ecr.aws/docker/library/docker:${tag}"

            # Use HEAD request to check existence
            if ! curl -sI -o /dev/null -f "$url"; then
              echo "::error::Image manifest not found in ECR Public: ${tag}"
              exit 1
            fi
            echo "Successfully verified ${tag}"
          done

  runtime-test:
    name: Runtime Tests (Docker ${{ matrix.docker-version }})
    needs: [filter, build]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        docker-version: ["20.10", "24.0", "27.0"]

    services:
      docker:
        image: public.ecr.aws/docker/library/docker:${{ matrix.docker-version }}-dind
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          -v /home/runner/work:/home/runner/work -v /tmp:/tmp
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Download Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cderun-binary

      - name: Make binary executable
        run: chmod +x cderun

      - name: Runtime Tests
        env:
          DOCKER_HOST: tcp://localhost:2375
          TEST_HOST_TMP_DIR: ${{ github.workspace }}/tmp-runtime
          CDERUN_HANG_TIMEOUT: 10s
        run: |
          mkdir -p $TEST_HOST_TMP_DIR
          docker version
          go test -v -tags=runtime -timeout 15m -run "^TestScenario_|^TestRuntime_" -coverprofile=coverage-runtime.out ./internal/command/...

      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-runtime.out
          flags: runtime
          env_vars: DOCKER_VERSION
          fail_ci_if_error: true
        env:
          DOCKER_VERSION: ${{ matrix.docker-version }}

  runtime-test-podman:
    name: Runtime Tests (Podman v5.8.1)
    needs: [filter, build]
    if: needs.filter.outputs.go == 'true'
    runs-on: ubuntu-latest
    container:
      image: quay.io/podman/stable:v5.8.1
      options: --privileged

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Download Binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cderun-binary

      - name: Make binary executable
        run: chmod +x cderun

      - name: Start Podman Service
        run: |
          mkdir -p /run/podman
          podman --log-level=debug system service --time=0 unix:///run/podman/podman.sock > /tmp/podman.log 2>&1 &
          timeout 30s sh -c 'while ! podman --url unix:///run/podman/podman.sock system info >/dev/null 2>&1; do sleep 1; done'
          chmod 666 /run/podman/podman.sock

      - name: Runtime Tests
        env:
          CDERUN_RUNTIME: podman
          CDERUN_SOCKET_PATH: /run/podman/podman.sock
          TEST_HOST_TMP_DIR: /tmp/runtime-podman
          CDERUN_HANG_TIMEOUT: 10s
        run: |
          mkdir -p $TEST_HOST_TMP_DIR
          CONTAINER_HOST=unix:///run/podman/podman.sock podman version
          DOCKER_HOST=unix:///run/podman/podman.sock go test -v -tags=runtime -timeout 15m -run "^TestScenario_|^TestRuntime_" -coverprofile=coverage-podman.out ./internal/command/...

      - name: Diagnostic on Failure
        if: failure()
        run: |
          echo "--- Podman Service Log ---"
          cat /tmp/podman.log || true
          echo "--- Podman Info ---"
          CONTAINER_HOST=unix:///run/podman/podman.sock podman system info || true

      - name: Upload to Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-podman.out
          flags: podman
          fail_ci_if_error: true
