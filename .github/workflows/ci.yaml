name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ouchi-kubernetes
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Run unit tests
      run: go test -v -coverprofile=coverage.out -covermode=atomic $(go list ./... | grep -v /scripts)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
      with:
        files: coverage.out
        flags: unit
        fail_ci_if_error: false

  runtime-test-containerd:
    runs-on: ouchi-kubernetes
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Install containerd
      run: |
        VERSION=2.2.3
        TARBALL="containerd-${VERSION}-linux-amd64.tar.gz"
        URL="https://github.com/containerd/containerd/releases/download/v${VERSION}/${TARBALL}"
        curl -fsSL "$URL" -o "$TARBALL"
        curl -fsSL "${URL}.sha256sum" -o "${TARBALL}.sha256sum"
        sha256sum -c "${TARBALL}.sha256sum"
        sudo tar Cxzvf /usr/local "$TARBALL"
        sudo mkdir -p /etc/containerd
        sudo containerd config default | sudo tee /etc/containerd/config.toml > /dev/null
        sudo containerd > /tmp/containerd.log 2>&1 &
        for i in {1..30}; do
          if [ -S /run/containerd/containerd.sock ]; then
            echo "containerd socket ready"
            break
          fi
          echo "Waiting for containerd socket..."
          sleep 1
        done
        if [ ! -S /run/containerd/containerd.sock ]; then
          echo "containerd failed to start. Logs:"
          cat /tmp/containerd.log
          exit 1
        fi
    - name: Install CNI plugins
      run: |
        VERSION=1.6.2
        TARBALL="cni-plugins-linux-amd64-v${VERSION}.tgz"
        URL="https://github.com/containernetworking/plugins/releases/download/v${VERSION}/${TARBALL}"
        curl -fsSL "$URL" -o "$TARBALL"
        curl -fsSL "${URL}.sha256" -o "${TARBALL}.sha256"
        echo "$(awk '{print $1}' ${TARBALL}.sha256)  ${TARBALL}" | sha256sum -c -
        sudo mkdir -p /opt/cni/bin
        sudo tar Cxzvf /opt/cni/bin "$TARBALL"
    - name: Set containerd socket ACLs
      run: |
        sudo apt-get update
        sudo apt-get install -y acl
        sudo setfacl -m u:${USER}:rw /run/containerd/containerd.sock
    - name: Run containerd integration tests
      run: |
        export CDERUN_RUNTIME=containerd
        export CDERUN_SOCKET_PATH=/run/containerd/containerd.sock
        go test -v ./internal/runtime/...

  runtime-test-docker:
    runs-on: ouchi-kubernetes
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Set Docker socket ACLs
      run: |
        sudo apt-get update
        sudo apt-get install -y acl
        sudo setfacl -m u:${USER}:rw /var/run/docker.sock
    - name: Run Docker integration tests
      run: |
        export CDERUN_RUNTIME=docker
        export CDERUN_SOCKET_PATH=/var/run/docker.sock
        go test -v ./internal/runtime/...

  runtime-test-podman:
    runs-on: ouchi-kubernetes
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: go.mod
    - name: Install and start Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman acl
        PODMAN_SOCK="/tmp/podman.sock"
        sudo podman --storage-driver vfs system service --time=0 "unix://${PODMAN_SOCK}" > /tmp/podman.log 2>&1 &
        for i in {1..30}; do
          if [ -S "$PODMAN_SOCK" ]; then
            echo "podman socket ready at $PODMAN_SOCK"
            break
          fi
          echo "Waiting for podman socket..."
          sleep 1
        done
        if [ ! -S "$PODMAN_SOCK" ]; then
          echo "podman socket failed to start. Logs:"
          cat /tmp/podman.log
          exit 1
        fi
        sudo setfacl -m u:${USER}:rw "$PODMAN_SOCK"
    - name: Run Podman integration tests
      run: |
        export CDERUN_RUNTIME=podman
        export CDERUN_SOCKET_PATH=/tmp/podman.sock
        go test -v ./internal/runtime/...
