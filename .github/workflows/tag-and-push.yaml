name: Tag and Push (Manual Release Trigger)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version tag to create (e.g. v0.0.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-and-push:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Version Format
        run: |
          # Enforces strict SemVer 2.0.0 grammar with an mandatory 'v' prefix
          SEMVER_REGEX="^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))(\.((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))|)*)?(\+([0-9a-zA-Z-]+)(\.[0-9a-zA-Z-]+)*)?$"
          if [[ ! "$RELEASE_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "::error::Invalid version format: '$RELEASE_VERSION'. Must match strict SemVer 2.0.0 grammar with a 'v' prefix (e.g., v0.0.7, v1.0.0-alpha.1)"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check if Tag Already Exists
        run: |
          if git show-ref --verify --quiet refs/tags/"$RELEASE_VERSION"; then
            echo "::error::Tag $RELEASE_VERSION already exists in the repository."
            exit 1
          fi

      - name: Verify Generated Options
        run: |
          make generate

      - name: Run Tests
        run: |
          make test

      - name: Tag and Push
        run: |
          echo "Configuring git bot..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Creating local tag: $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "Release $RELEASE_VERSION triggered via GitHub Actions manual workflow"

          echo "Pushing tag to origin..."
          git push "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "$RELEASE_VERSION"
