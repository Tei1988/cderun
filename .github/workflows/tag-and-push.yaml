name: Tag and Push (Manual Release Trigger)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The release version tag to create (e.g. v0.0.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  tag-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Validate Version Format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION. Must match semver with a 'v' prefix, e.g., v0.0.7"
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check if Tag Already Exists
        run: |
          TAG="${{ inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in the repository."
            exit 1
          fi

      - name: Verify Generated Options
        run: |
          make generate

      - name: Run Tests
        run: |
          make test

      - name: Tag and Push
        run: |
          TAG="${{ inputs.version }}"
          echo "Configuring git bot..."
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          echo "Creating local tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG triggered via GitHub Actions manual workflow"

          echo "Pushing tag to origin..."
          git push origin "$TAG"
