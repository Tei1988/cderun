version: "2"

linters:
  enable:
    # Defaults
    - govet
    - staticcheck
    - errcheck
    - unused
    # Additional
    - gosec
    - bidichk
    - errorlint
    - bodyclose
    - unconvert
    - usestdlibvars
    - modernize
    - exhaustive
    - testifylint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
  settings:
    staticcheck:
      checks:
        - "all"
        - "-ST1000"
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Print
        - fmt.Printf
        - fmt.Println
        - io.Copy
        - (*github.com/docker/docker/api/types.HijackedResponse).CloseWrite
        - (github.com/docker/docker/api/types.HijackedResponse).CloseWrite
        - (*io.ReadCloser).Close
        - io.Closer.Close
    # unused:
    #   parameters-are-used: false
    testifylint:
      enable:
        - require-error

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Tei1988/cderun

run:
  timeout: 5m
  modules-download-mode: readonly

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
